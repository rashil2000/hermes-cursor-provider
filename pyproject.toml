[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "hermes-cursor-provider"
version = "0.1.0"
description = "Hermes model-provider plugin for approved Cursor subscription models"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Rashil" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]

[project.scripts]
hermes-cursor = "hermes_cursor_provider.cli:main"

[project.entry-points."hermes_agent.plugins"]
cursor = "hermes_cursor_provider:register"

[project.optional-dependencies]
dev = [
  "mypy>=1.14",
  "pytest>=8.3",
  "ruff>=0.9",
]

[tool.hatch.build.targets.wheel]
packages = ["src/hermes_cursor_provider"]

[tool.hatch.build.targets.wheel.force-include]
"plugin.yaml" = "hermes_cursor_provider/plugin.yaml"
"worker/worker.bundle.mjs" = "hermes_cursor_provider/worker/worker.bundle.mjs"
"worker/worker.bundle.mjs.LEGAL.txt" = "hermes_cursor_provider/worker/worker.bundle.mjs.LEGAL.txt"
"THIRD_PARTY_NOTICES.md" = "hermes_cursor_provider/THIRD_PARTY_NOTICES.md"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
  "live_cursor: requires explicit Cursor credentials and network access",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["hermes_cursor_provider"]
explicit_package_bases = true
